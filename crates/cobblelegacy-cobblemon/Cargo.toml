[package]
name = "cobblelegacy-cobblemon"
version = "0.1.0"
edition.workspace = true
# Not the workspace's MIT: these files follow the layouts of Cobblemon 1.8.1's own sources
# (https://gitlab.com/cable-mc/cobblemon, MPL-2.0), so they stay under its licence.
license = "MPL-2.0"
rust-version.workspace = true
description = "CobbleLegacy: what a Cobblemon 1.8.1 server sends to its client, read for the Horizon client"

[dependencies]
horizon-protocol = { path = "../horizon-protocol" }
horizon-world = { path = "../horizon-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
